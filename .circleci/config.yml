version: 2
jobs:
  build:
    docker:
      - image: cimg/python:3.10.18-node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            npm ci
            pip install uv
            uv sync --all-extras --dev
      - run:
          name: Run tests
          command: |
            npm test
            uv run --frozen pytest
