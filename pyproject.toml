[project]
name = "chrys"
version = "4.3.3"
description = "A collection of color palettes for mapping and visualisation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "twine>=6.2.0",
    "ty>=0.0.95",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
force_alphabetical_sort = true
line_length = 100
profile = "black"
py_version = 313

[tool.pytest.ini_options]
addopts = "--no-header -vv -s"
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chrys"]
omit = ["chrys/data/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.coverage.html]
directory = "coverage/python"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D107", "D205",
    # Rule is ignored for ruff >= 0.16. TODO Configure isort and ruff to work together.
    "I001"
]

[tool.ty.rules]
invalid-method-override = "ignore" # https://github.com/astral-sh/ty/issues/2154

[tool.ty.src]
include = ["src", "tests"]

[tool.uv]
required-version = ">=0.13.4"
exclude-newer = "7 days"
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
